name: Al-Hakim Pro CI/CD - Build, Package & Auto-Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package APK & Auto-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Inject Version into Code
        run: |
          # توليد رقم إصدار تصاعدي بناءً على رقم البناء في GitHub لضمان توافق أندرويد
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="4.0.${{ github.run_number }}"
          sed -i "s/APP_VERSION = '.*'/APP_VERSION = '$VERSION_NAME'/g" constants.ts
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "tag=$VERSION_NAME" >> $GITHUB_OUTPUT
        id: version_logic

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Generate Version Manifest
        run: |
          echo "{\"version\": \"${{ steps.version_logic.outputs.tag }}\", \"buildDate\": \"$(date -u)\"}" > dist/version.json
        id: version_manifest

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Add and Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          # Generate native assets (icons/splash)
          npm run cap:assets
          npx cap sync android

      - name: Build Android APK
        run: |
          test -d android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: ${{ steps.version_logic.outputs.tag }}
          name: "Al-Hakim Pro Medical System Release ${{ steps.version_logic.outputs.tag }}"
          body: |
            ### 🩺 الحكيم الذكي Pro - الإصدار التلقائي (Auto-Release)
            - **تاريخ البناء:** ${{ steps.version_logic.outputs.tag }}
            - **المميزات:** محرك تشخيص ذكي معتمد على الأدلة، قاعدة بيانات SQLite محلية مدمجة، وتحليل متقدم ومضبوط لصور الأشعة والتقارير المخبرية.
            - **التثبيت:** قم بتحميل ملف `app-debug.apk` أدناه وثبته مباشرة على هاتفك الأندرويد.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
