name: Al-Hakim Pro CI/CD - Build, Package & Auto-Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package APK & Auto-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Add and Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx cap sync android

      - name: Build Android APK
        run: |
          test -d android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate Version Tag
        id: version
        run: |
          TAG="v4.0.$(date +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Al-Hakim Pro Medical System Release ${{ steps.version.outputs.tag }}"
          body: |
            ### 🩺 الحكيم الذكي Pro - الإصدار التلقائي (Auto-Release)
            - **تاريخ البناء:** ${{ steps.version.outputs.tag }}
            - **المميزات:** محرك تشخيص ذكي معتمد على الأدلة، قاعدة بيانات SQLite محلية مدمجة، وتحليل متقدم ومضبوط لصور الأشعة والتقارير المخبرية.
            - **التثبيت:** قم بتحميل ملف `app-debug.apk` أدناه وثبته مباشرة على هاتفك الأندرويد.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
