name: Al-Hakim Pro CI/CD - Build & Package APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-package:
    name: Build Web App & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application & Server Bundle
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Add and Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx cap sync android

      - name: Build Android APK (Debug / Release)
        run: |
          test -d android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Archive APK and Web Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alhakim-pro-android-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/
        if: success()
