name: Al-Hakim Pro CI/CD - Build & Package APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-package:
    name: Build Web App & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application & Server Bundle
        run: npm run build

      - name: Set up Java JDK for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add and Sync Capacitor Android Platform
        run: |
          npx @capacitor/cli add android || true
          npx cap sync android

      - name: Build Android APK (Debug / Release)
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
            cd ..
          else
            echo "Android directory not found, skipping Gradle build"
          fi

      - name: Archive APK and Web Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alhakim-pro-android-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/
        if: always()
